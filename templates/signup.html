<!DOCTYPE html>
<html>

<head>

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Signup - Kickoff</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='styles.css') }}">

</head>

<body class="auth-page">

    <div class="auth-pixel-bg" aria-hidden="true"></div>

    <div class="logo-container">

        <img src="{{ url_for('static', filename='images/logo.png') }}"
             class="logo">

    </div>

    {% include "_flash.html" %}

    <div class="container">

        <div class="match-card">

            <h2>Create Account</h2>

            <form method="post">

                <input type="text"
                       name="name"
                       placeholder="Name">

                <input type="text"
                       name="username"
                       placeholder="Username"
                       required>

                <input type="password"
                       name="password"
                       placeholder="Password"
                       required>

                <button type="submit">
                    Sign Up
                </button>

            </form>

        </div>

    </div>

</body>

</html>
